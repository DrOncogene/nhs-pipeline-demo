      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

}\n\n/* Dark mode styles */\n.dark .env-config-widget,\n.dark-theme .env-config-widget,\n[data-theme=\"dark\"] .env-config-widget {\n  --env-bg: #1e1e1e;\n  --env-bg-row: #2a2a2a;\n  --env-bg-input: #2a2a2a;\n  --env-border: #3a3a3a;\n  --env-text: #e0e0e0;\n  --env-text-muted: #a0a0a0;\n  --env-accent: #4d9fff;\n  --env-success: #4ade80;\n  --env-success-bg: rgba(74, 222, 128, 0.15);\n  --env-error: #f87171;\n  --env-error-bg: rgba(248, 113, 113, 0.15);\n  --env-shadow: rgba(0, 0, 0, 0.3);\n}\n", "_dom_classes": [], "_esm": "function render({ model, el }) {\n  el.classList.add(\"env-config-widget\");\n\n  const container = document.createElement(\"div\");\n  container.className = \"env-config-container\";\n\n  // Store references to update in place (no DOM rebuild)\n  const rows = [];\n  const inputs = [];\n  const statusEls = [];\n  let footer;\n\n  function buildInitialDOM() {\n    const variables = model.get(\"variables\");\n\n    variables.forEach((variable, index) =\u003E {\n      const row = document.createElement(\"div\");\n      row.className = \"env-config-row\";\n      row.dataset.status = variable.status;\n      rows.push(row);\n\n      // Variable name\n      const nameEl = document.createElement(\"div\");\n      nameEl.className = \"env-var-name\";\n      nameEl.textContent = variable.name;\n      row.appendChild(nameEl);\n\n      // Input field\n      const fieldEl = document.createElement(\"div\");\n      fieldEl.className = \"env-var-field\";\n\n      const input = document.createElement(\"input\");\n      input.type = \"password\";\n      input.className = \"env-input\";\n      input.autocomplete = \"off\";\n      inputs.push(input);\n\n      // Set initial value/placeholder - show value even for invalid status\n      if (variable.status === \"valid\" || variable.status === \"invalid\") {\n        input.value = variable.value || \"\";\n      }\n      if (variable.status === \"missing\") {\n        input.placeholder = \"Enter value...\";\n      }\n\n      // Submit on Enter only - let Tab work naturally\n      input.addEventListener(\"keydown\", (e) =\u003E {\n        if (e.key === \"Enter\") {\n          e.preventDefault();\n          const value = input.value.trim();\n          if (!value) return;\n\n          model.set(\"_pending_value\", {\n            name: variable.name,\n            value: value,\n          });\n          model.save_changes();\n        }\n      });\n\n      fieldEl.appendChild(input);\n      row.appendChild(fieldEl);\n\n      // Status indicator\n      const statusEl = document.createElement(\"div\");\n      statusEl.className = \"env-var-status\";\n      statusEls.push(statusEl);\n      updateStatusIcon(statusEl, variable);\n\n      row.appendChild(statusEl);\n      container.appendChild(row);\n    });\n\n    // Footer\n    footer = document.createElement(\"div\");\n    updateFooter();\n    container.appendChild(footer);\n\n    el.appendChild(container);\n  }\n\n  function updateStatusIcon(statusEl, variable) {\n    if (variable.status === \"valid\") {\n      statusEl.innerHTML = `\n        \u003Csvg class=\"env-check\" viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"\u003E\n          \u003Cpath d=\"M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z\" fill=\"currentColor\"/\u003E\n        \u003C/svg\u003E\n      `;\n    } else if (variable.status === \"invalid\") {\n      statusEl.innerHTML = `\n        \u003Cspan class=\"env-error-text\" title=\"${variable.error || \"Invalid\"}\"\u003E\n          \u003Csvg class=\"env-error-icon\" viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"\u003E\n            \u003Cpath d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z\" fill=\"currentColor\"/\u003E\n          \u003C/svg\u003E\n        \u003C/span\u003E\n      `;\n    } else {\n      statusEl.innerHTML = \"\";\n    }\n  }\n\n  function updateFooter() {\n    const allValid = model.get(\"all_valid\");\n    footer.className = \"env-config-footer\";\n    footer.textContent = allValid\n      ? \"All variables configured\"\n      : \"Press Enter to set each variable\";\n  }\n\n  function updateInPlace() {\n    const variables = model.get(\"variables\");\n\n    variables.forEach((variable, index) =\u003E {\n      const row = rows[index];\n      const input = inputs[index];\n      const statusEl = statusEls[index];\n\n      // Update row status (for background color)\n      row.dataset.status = variable.status;\n\n      // Update input based on status - show value even for invalid status\n      if (variable.status === \"valid\" || variable.status === \"invalid\") {\n        // Only update value if it changed (avoid overwriting while user types)\n        if (input.value !== variable.value) {\n          input.value = variable.value || \"\";\n        }\n        input.placeholder = \"\";\n      } else {\n        input.placeholder = \"Enter value...\";\n      }\n\n      // Update status icon\n      updateStatusIcon(statusEl, variable);\n    });\n\n    updateFooter();\n  }\n\n  buildInitialDOM();\n  model.on(\"change:variables\", updateInPlace);\n}\n\nexport default { render };\n", "_model_module": "anywidget", "_model_module_version": "~0.10.*", "_model_name": "AnyModel", "_pending_value": {}, "_view_count": null, "_view_module": "anywidget", "_view_module_version": "~0.10.*", "_view_name": "AnyView", "all_valid": true, "layout": "IPY_MODEL_68caf415d5c74263a6904aa6cd51d94c", "tabbable": null, "tooltip": null, "variables": [{"error": null, "has_validator": false, "name": "***REMOVED***", "status": "valid", "value": "***REMOVED***"}, {"error": null, "has_validator": false, "name": "***REMOVED***", "status": "valid", "value": "***REMOVED***"}, {"error": null, "has_validator": true, "name": "***REMOVED***", "status": "valid", "value": "***REMOVED***"}, {"error": null, "has_validator": false, "name": "***REMOVED***", "status": "valid", "value": "***REMOVED***"}]}}, "model_id": "95ab55555f06401eb649775ee4ff5753", "op": "model-
